version: '3.8'

# ==============================================================================
# InfraPilot Local Development Services Stack (Section 8 of Guide v2.1)
# ==============================================================================
services:
  postgres:
    image: postgres:15
    container_name: infrapilot-postgres
    environment:
      POSTGRES_DB: infrapilot
      POSTGRES_USER: infrapilot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-only}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infrapilot"]
      interval: 10s
      retries: 5
    networks:
      - infrapilot-net

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: infrapilot-prometheus
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
    ports:
      - "9090:9090"
    networks:
      - infrapilot-net

  grafana:
    image: grafana/grafana:10.2.0
    container_name: infrapilot-grafana
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    networks:
      - infrapilot-net

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: infrapilot-node-exporter
    ports:
      - "9100:9100"
    networks:
      - infrapilot-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: infrapilot-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8082:8080"
    networks:
      - infrapilot-net

networks:
  infrapilot-net:
    driver: bridge
