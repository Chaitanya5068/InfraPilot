<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — InfraPilot Task Tracker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="justify-content: center; align-items: center; background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0a0e17 80%);">
    <div style="background: rgba(17, 24, 39, 0.9); border: 1px solid var(--border-color); border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand" style="justify-content: center; margin-bottom: 0.5rem; font-size: 1.5rem;">⚡ TaskTracker</div>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Sign in to your demo workspace</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" value="developer" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" value="demo123" required>
            </div>
            <button type="submit" class="btn" style="width: 100%; justify-content: center; margin-top: 1rem;">Sign In</button>
            <div style="margin-top: 1.5rem; text-align: center;">
                <a href="/" style="color: var(--text-secondary); text-decoration: none; font-size: 0.85rem;">← Back to Task Dashboard</a>
            </div>
        </form>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('demo_token', data.token);
                    window.location.href = '/';
                } else {
                    alert('Invalid credentials. (Hint: username developer / demo123)');
                }
            } catch (err) {
                alert('Connection error: ' + err.message);
            }
        }
    </script>
</body>
</html>
