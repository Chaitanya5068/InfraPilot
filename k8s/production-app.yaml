apiVersion: v1
kind: Namespace
metadata:
  name: infrapilot-prod
  labels:
    app.kubernetes.io/part-of: infrapilot
    environment: production
    security.istio.io/tlsMode: istio
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: infrapilot-config
  namespace: infrapilot-prod
data:
  SPRING_PROFILES_ACTIVE: "prod"
  APP_PORT: "8080"
  DB_HOST: "postgres-service.infrapilot-prod.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "infrapilot"
  REDIS_HOST: "redis-service.infrapilot-prod.svc.cluster.local"
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: Secret
metadata:
  name: infrapilot-secrets
  namespace: infrapilot-prod
type: Opaque
stringData:
  DB_USER: "infrapilot_app"
  DB_PASS: "SuperSecureClusterSecret2026!"
  JWT_SECRET: "k8s-infrasecret-token-sign-32char-length-key!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrapilot-app
  namespace: infrapilot-prod
  labels:
    app: infrapilot
    tier: fullstack
    version: v2.4.1
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: infrapilot
  template:
    metadata:
      labels:
        app: infrapilot
        tier: fullstack
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/api/v1/health"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - infrapilot
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: infrapilot-core
          image: ghcr.io/chaitanya5068/infrapilot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: infrapilot-config
            - secretRef:
                name: infrapilot-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: infrapilot-service
  namespace: infrapilot-prod
  labels:
    app: infrapilot
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: infrapilot
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: infrapilot-hpa
  namespace: infrapilot-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: infrapilot-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infrapilot-ingress
  namespace: infrapilot-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
spec:
  tls:
    - hosts:
        - app.infrapilot.dev
      secretName: infrapilot-tls-cert
  rules:
    - host: app.infrapilot.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infrapilot-service
                port:
                  number: 80
