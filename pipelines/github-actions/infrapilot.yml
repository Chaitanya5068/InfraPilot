name: infrapilot
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build & Run Unit Tests
        run: ./mvnw -B verify || mvn -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/surefire-reports'

  security:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency and filesystem scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      - name: IaC scan (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/
          soft_fail: false

  image:
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - name: Build Container Image
        run: docker build -t app:${{ github.sha }} -f demo-app/Dockerfile demo-app/
      - name: Trivy Container Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app:${{ github.sha }}'
          severity: CRITICAL
          exit-code: '1'

  report:
    runs-on: ubuntu-latest
    needs: image
    if: always()
    steps:
      - name: Notify InfraPilot
        run: |
          curl -s -X POST "${{ secrets.INFRAPILOT_API }}/api/v1/callbacks/run" \
            -H "Authorization: Bearer ${{ secrets.INFRAPILOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"runRef\":\"${{ github.run_id }}\",\"status\":\"${{ job.status }}\"}" || true
