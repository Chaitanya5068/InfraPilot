# Production environment values override
replicaCount: 3

image:
  repository: ghcr.io/chaitanya5068/infrapilot
  pullPolicy: IfNotPresent
  tag: "v2.4.1"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: app.infrapilot.dev
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: infrapilot-prod-tls
      hosts:
        - app.infrapilot.dev

env:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  DB_HOST: "aurora-pg-cluster.infrapilot.internal"
  DB_PORT: "5432"
  DB_NAME: "infrapilot"
