# ==============================================================================
# InfraPilot Terraform GitOps CI: Formatting, TFLint, Checkov & Plan
# ==============================================================================
name: Terraform Cloud IaC Pipeline

on:
  pull_request:
    paths:
      - 'infrastructure/**'
      - '.github/workflows/terraform-ci.yml'
  push:
    branches: [ main ]
    paths:
      - 'infrastructure/**'

jobs:
  terraform-audit:
    name: 🏗️ Terraform Validate, Lint & Security Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/aws/templates/fullstack-standard
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../../

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Run TFLint
        run: |
          tflint --init || true
          tflint -f compact || true

      - name: Checkov IaC Compliance Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/aws/
          framework: terraform
          soft_fail: true
          output_format: cli

      - name: Terraform Init (Mock Backend)
        run: |
          terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate
