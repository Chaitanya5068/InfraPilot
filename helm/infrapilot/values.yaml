# Default values for infrapilot Helm chart
replicaCount: 2

image:
  repository: ghcr.io/chaitanya5068/infrapilot
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: dev.infrapilot.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

env:
  ENVIRONMENT: "development"
  LOG_LEVEL: "DEBUG"
  DB_HOST: "postgres-dev.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "infrapilot_dev"
