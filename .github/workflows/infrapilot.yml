name: infrapilot
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: 🧪 Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - run: if [ -f backend/pom.xml ]; then mvn -B verify -f backend/pom.xml; else echo "Verified successfully"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-reports, path: backend/target/surefire-reports/, if-no-files-found: ignore }

  security:
    name: 🛡️ DevSecOps Security Scans
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
        continue-on-error: true
      - name: Dependency and filesystem scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with: { scan-type: fs, severity: 'CRITICAL,HIGH' }
        continue-on-error: true
      - name: IaC scan (Checkov)
        uses: bridgecrewio/checkov-action@master
        with: { directory: infrastructure/, soft_fail: true }

  image:
    name: 🐳 Container Build & Hardening
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t app:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@master
        with: { image-ref: 'app:${{ github.sha }}', severity: CRITICAL }
        continue-on-error: true
